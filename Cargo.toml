[package]
name = "acord"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/bin/server/server.rs"

[[bin]]
name = "client"
path = "src/bin/client/client.rs"

[[bin]]
name = "testing"
path = "src/bin/testing/testing.rs"

[dependencies]
aead = "0.5.2"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
crossterm = "0.29.0"
rand = "0.9.1"
rand_core = "0.9.3"
tokio = { version = "1.44.2", features = ["full"] }
